      <section>
        <h2>Frequently Asked Questions on Azure Governance</h2>
        <dl>
          <dt><strong>What is the Microsoft Cloud Adoption Framework (CAF) naming standard?</strong></dt>
          <dd>The CAF naming standard structures Azure resource names using consistent components such as resource type prefixes, workload identifiers, environment codes, Azure region abbreviations, and instance counters.</dd>
          
          <dt><strong>How do Management Groups help manage Azure Subscriptions?</strong></dt>
          <dd>Management Groups allow organizational policies, role-based access control (RBAC), and budgets to be enforced hierarchically across multiple subscriptions in enterprise landing zones.</dd>
          
          <dt><strong>Why enforce tagging with Azure Policy?</strong></dt>
          <dd>Tagging enforcement ensures cost transparency, automated chargeback reporting, owner accountability, and compliance across all cloud resources.</dd>
        </dl>
